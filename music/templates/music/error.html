<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crescendo | {{ status }} {{ heading }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .panel {
            background-color: #181818;
            border: 1px solid #282828;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 620px;
            width: 100%;
            text-align: center;
        }
        .status-code {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.02em;
        }
        .detail {
            background-color: #101010;
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 0.9rem 1rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.85rem;
            color: #e6e6e6;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 260px;
            overflow-y: auto;
        }
        .type-pill {
            background-color: #2a2a2a;
            border-radius: 50px;
            padding: 0.2rem 0.8rem;
            font-size: 0.75rem;
            display: inline-block;
        }
        .btn-spotify {
            background-color: #1db954;
            color: #000;
            font-weight: 700;
            border-radius: 50px;
            padding: 0.5rem 1.5rem;
            border: none;
        }
        .btn-outline-spotify {
            border: 1px solid #3e3e3e;
            color: #ffffff;
            font-weight: 600;
            border-radius: 50px;
            padding: 0.5rem 1.5rem;
            background: transparent;
        }
        .btn-outline-spotify:hover { border-color: #1db954; color: #1db954; }
        .text-subdued { color: #b3b3b3; }
    </style>
</head>
<body>
    <div class="panel">
        {% if status == 404 %}
            <i class="fa-solid fa-magnifying-glass fa-2x mb-3" style="color:#b3b3b3;"></i>
        {% elif status == 403 %}
            <i class="fa-solid fa-lock fa-2x mb-3" style="color:#e0a800;"></i>
        {% else %}
            <i class="fa-solid fa-triangle-exclamation fa-2x mb-3" style="color:#e0a800;"></i>
        {% endif %}

        <div class="status-code mb-1">{{ status }}</div>
        <h1 class="h5 fw-bold mb-3">{{ heading }}</h1>

        <div class="detail mb-3">{{ message }}</div>

        <p class="mb-4">
            <span class="type-pill">{{ exception_type }}</span>
        </p>

        <div class="d-flex gap-2 justify-content-center flex-wrap">
            <a href="{{ back_url }}" class="btn btn-spotify">
                <i class="fa-solid fa-arrow-left me-1"></i> Back
            </a>
            <a href="{% url 'home' %}" class="btn btn-outline-spotify">Home</a>
        </div>
    </div>
</body>
</html>
