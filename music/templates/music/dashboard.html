<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crescendo | {{ user.username }}'s Profile</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --spotify-black: #121212;
            --spotify-card: #181818;
            --spotify-card-hover: #282828;
            --spotify-green: #1db954;
            --spotify-green-hover: #1ed760;
            --spotify-text-subdued: #b3b3b3;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--spotify-black); color: #ffffff; min-height: 100vh; }
        
        
        .auth-bar { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #282828; }
        .brand-logo { color: var(--spotify-green); font-weight: 800; font-size: 1.5rem; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
        .brand-logo:hover { color: var(--spotify-green-hover); }
        
        
        .btn-outline-spotify { background-color: transparent; color: #ffffff; font-weight: 700; border-radius: 50px; padding: 0.5rem 1.5rem; border: 1px solid #727272; transition: all 0.2s; }
        .btn-outline-spotify:hover { border-color: #ffffff; color: #ffffff; }

        
        .stat-card { background-color: var(--spotify-card); border-radius: 12px; padding: 2rem; text-align: center; border: 1px solid #282828; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-5px); background-color: var(--spotify-card-hover); }
        .stat-number { font-size: 3rem; font-weight: 800; color: var(--spotify-green); line-height: 1; margin-bottom: 0.5rem; }
        
        .profile-header { background: linear-gradient(180deg, #282828 0%, var(--spotify-black) 100%); padding: 4rem 0; margin-bottom: 2rem; border-bottom: 1px solid #282828; }
        .avatar-circle { width: 150px; height: 150px; background-color: #3e3e3e; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 4rem; color: #ffffff; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }

        .text-green { color: var(--spotify-green); }
        .text-subdued { color: var(--spotify-text-subdued); }
        .custom-hover { transition: color 0.2s; text-decoration: none; }
        .custom-hover:hover { color: var(--spotify-green) !important; }
    </style>
</head>
<body>

    <div class="auth-bar shadow-sm">
        <a href="{% url 'home' %}" class="brand-logo">
            <i class="fa-solid fa-circle-play"></i> Crescendo
        </a>
        <div class="d-flex align-items-center">
            <a href="{% url 'playlists' %}" class="btn btn-outline-spotify btn-sm me-2 border-0 text-white">
                <i class="fa-solid fa-list"></i> Playlists
            </a>
            <a href="{% url 'library' %}" class="btn btn-outline-spotify btn-sm me-4 border-0 text-white">
                <i class="fa-solid fa-book-open"></i> My Library
            </a>
            <span class="me-4 text-subdued fw-bold">Hi, <a href="{% url 'dashboard' %}" class="text-green custom-hover">{{ user.username }}</a></span>
            <form method="POST" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-spotify btn-sm">Log Out</button>
            </form>
        </div>
    </div>

    <div class="profile-header text-center">
        <div class="container">

        {% include "music/partials/messages.html" %}

            <div class="avatar-circle">
                <i class="fa-solid fa-user"></i>
            </div>
            <h1 class="display-4 fw-bold mb-2">{{ user.username }}</h1>
            <p class="text-subdued fs-5">Member since {{ user.date_joined|date:"F Y" }}</p>
        </div>
    </div>

    <div class="container mb-5 pb-5">
        <div class="row justify-content-center g-4">
            
            <div class="col-md-5 col-lg-4">
                <a href="{% url 'library' %}" class="text-decoration-none">
                    <div class="stat-card">
                        <i class="fa-solid fa-heart fs-3 text-subdued mb-3"></i>
                        <div class="stat-number">{{ liked_count }}</div>
                        <h5 class="text-white fw-bold m-0">Liked Songs</h5>
                    </div>
                </a>
            </div>

            <div class="col-md-5 col-lg-4">
                <a href="{% url 'playlists' %}" class="text-decoration-none">
                    <div class="stat-card">
                        <i class="fa-solid fa-list fs-3 text-subdued mb-3"></i>
                        <div class="stat-number">{{ playlist_count }}</div>
                        <h5 class="text-white fw-bold m-0">Playlists Created</h5>
                    </div>
                </a>
            </div>

        </div>
    </div>
    
    {% include "music/partials/player.html" %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
