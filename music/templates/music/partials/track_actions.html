<style>
    
    .toast-stack {
        position: fixed;
        right: 1.25rem;
        bottom: calc(var(--player-height, 90px) + 1.25rem);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        z-index: 1200;
        pointer-events: none;
    }
    .mini-toast {
        background: #2a2a2a;
        color: #ffffff;
        border-left: 3px solid #1db954;
        border-radius: 6px;
        padding: 0.6rem 0.9rem;
        font-size: 0.85rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.2s ease, transform 0.2s ease;
        max-width: 300px;
    }
    .mini-toast.show { opacity: 1; transform: translateY(0); }
    .mini-toast.warn { border-left-color: #e0a800; }
    .mini-toast.err  { border-left-color: #e91429; }

    
    @keyframes heart-pop {
        0%   { transform: scale(1); }
        45%  { transform: scale(1.35); }
        100% { transform: scale(1); }
    }
    .heart-pop { animation: heart-pop 0.32s ease; }

    .js-like-form button[disabled],
    .js-playlist-form button[disabled] { opacity: 0.5; }
</style>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script>
(function () {
    const stack = document.getElementById('toastStack');

    function toast(message, kind) {
        const el = document.createElement('div');
        el.className = 'mini-toast' + (kind ? ' ' + kind : '');
        el.textContent = message;
        stack.appendChild(el);
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
            el.classList.remove('show');
            setTimeout(() => el.remove(), 250);
        }, 2600);
    }

    function csrf(form) {
        const field = form.querySelector('[name=csrfmiddlewaretoken]');
        return field ? field.value : '';
    }

    async function post(form) {
        const response = await fetch(form.action, {
            method: 'POST',
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': csrf(form),
            },
            body: new FormData(form),
            credentials: 'same-origin',
        });

        const type = response.headers.get('content-type') || '';
        if (!response.ok || !type.includes('application/json')) {
            throw new Error('non-json');
        }
        return response.json();
    }

    document.addEventListener('submit', async (event) => {
        const form = event.target.closest('.js-like-form');
        if (!form) return;

        event.preventDefault();
        const button = form.querySelector('button');
        const icon = form.querySelector('i');
        if (button) button.disabled = true;

        try {
            const data = await post(form);

            if (icon) {
                icon.className = data.liked
                    ? 'fa-solid fa-heart text-green fs-5'
                    : 'fa-regular fa-heart text-subdued fs-5';
                icon.classList.add('heart-pop');
                setTimeout(() => icon.classList.remove('heart-pop'), 340);
            }

            form.dataset.liked = data.liked ? '1' : '0';
            document.dispatchEvent(new CustomEvent('crescendo:like', { detail: data }));

            const title = form.dataset.trackTitle || 'Track';
            toast(data.liked ? 'Added to your library: ' + title
                             : 'Removed from your library: ' + title);
        } catch (err) {
            form.submit();
            return;
        } finally {
            if (button) button.disabled = false;
        }
    });

    document.addEventListener('submit', async (event) => {
        const form = event.target.closest('.js-playlist-form');
        if (!form) return;

        event.preventDefault();
        const button = form.querySelector('button');
        if (button) button.disabled = true;

        try {
            const data = await post(form);

            if (data.already_present) {
                toast('"' + data.track_title + '" is already in ' + data.playlist_name, 'warn');
            } else {
                toast('Added "' + data.track_title + '" to ' + data.playlist_name);
            }

            const menu = form.closest('.dropdown-menu');
            if (menu && window.bootstrap) {
                const trigger = menu.parentElement.querySelector('[data-bs-toggle="dropdown"]');
                if (trigger) {
                    const instance = bootstrap.Dropdown.getOrCreateInstance(trigger);
                    instance.hide();
                }
            }
        } catch (err) {
            form.submit();
            return;
        } finally {
            if (button) button.disabled = false;
        }
    });
})();
</script>
