<!DOCTYPE html>
<html lang="en">
<head>
    <title>Crescendo | Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <h1 class="display-4 text-info fw-bold">Crescendo</h1>
        <p class="lead text-secondary">Your personal music library.</p>
        <hr class="border-secondary">
        
        <h3 class="mb-4 mt-4">Featured Tracks</h3>
        
        <div class="list-group" style="max-width: 700px;">
            {% for track in tracks %}
                <div class="list-group-item bg-secondary text-white border-dark mb-2 rounded shadow-sm d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1 text-info">{{ track.title }}</h5>
                        <small>by <strong>{{ track.album.artist.name }}</strong></small>
                    </div>
                    <span class="badge bg-dark rounded-pill fs-6">{{ track.formatted_duration }}</span>
                </div>
            {% empty %}
                <div class="alert alert-warning" role="alert">
                    Database is currently empty. Please add music via the admin dashboard!
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
