<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crescendo | Not allowed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .panel {
            background-color: #181818;
            border: 1px solid #282828;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 520px;
            text-align: center;
        }
        .role-pill {
            background-color: #2a2a2a;
            border-radius: 50px;
            padding: 0.2rem 0.8rem;
            font-size: 0.8rem;
            display: inline-block;
        }
        .btn-spotify {
            background-color: #1db954;
            color: #000;
            font-weight: 700;
            border-radius: 50px;
            padding: 0.5rem 1.5rem;
            border: none;
        }
        .text-subdued { color: #b3b3b3; }
    </style>
</head>
<body>
    <div class="panel">
        <i class="fa-solid fa-lock fa-2x mb-3" style="color:#e0a800;"></i>
        <h1 class="h4 fw-bold mb-2">403 &mdash; Not allowed</h1>

        <p class="text-subdued mb-3">
            This action is restricted to
            {% for role in required_roles %}<strong class="text-white">{{ role }}</strong>{% if not forloop.last %} or {% endif %}{% endfor %}.
        </p>

        <p class="mb-4">
            <span class="role-pill">You are signed in as <strong>{{ your_role }}</strong></span>
        </p>

        <a href="{% url 'home' %}" class="btn btn-spotify">Back to Crescendo</a>
    </div>
</body>
</html>
