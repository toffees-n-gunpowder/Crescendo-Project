<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Crescendo</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --spotify-black: #121212;
            --spotify-card: #181818;
            --spotify-green: #1db954;
            --spotify-green-hover: #1ed760;
            --spotify-text-subdued: #b3b3b3;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--spotify-black);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-card {
            background-color: var(--spotify-card);
            border: none;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.75rem;
            color: var(--spotify-green);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-spotify {
            background-color: var(--spotify-green);
            border: none;
            color: #000000;
            font-weight: 700;
            border-radius: 50px;
            padding: 0.75rem 1.5rem;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-spotify:hover {
            background-color: var(--spotify-green-hover);
            color: #000000;
            transform: scale(1.02);
        }

        .form-control, .form-select {
            background-color: #242424;
            border: 1px solid #3e3e3e;
            color: #ffffff;
            border-radius: 8px;
            padding: 0.65rem 1rem;
        }

        .form-control:focus, .form-select:focus {
            background-color: #2a2a2a;
            border-color: var(--spotify-green);
            box-shadow: 0 0 0 0.2rem rgba(29, 185, 84, 0.25);
            color: #ffffff;
        }

        p label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--spotify-text-subdued);
        }

        .helptext, .form-text {
            display: block;
            font-size: 0.75rem;
            color: #727272;
            margin-top: 0.25rem;
        }

        ul.errorlist {
            color: #ff5555;
            list-style: none;
            padding-left: 0;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        .text-subdued {
            color: var(--spotify-text-subdued);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-4">
            <a href="{% url 'home' %}" class="brand-logo mb-2">
                <i class="fa-solid fa-circle-play"></i> Crescendo
            </a>
            <h1 class="h4 fw-bold mt-2 mb-1">Sign up for free</h1>
            <p class="text-subdued small mb-0">Start listening to timeless music across eras.</p>
        </div>

        <form method="post" action="{% url 'register' %}">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="alert alert-danger small py-2 px-3 mb-3">
                    {% for error in form.non_field_errors %}
                        <div>{{ error }}</div>
                    {% endfor %}
                </div>
            {% endif %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-spotify mt-3">
                Sign Up
            </button>
        </form>

        <div class="border-top border-secondary border-opacity-25 pt-3 mt-4 text-center">
            <p class="text-subdued small mb-0">
                Already have an account? 
                <a href="{% url 'login' %}" class="text-success text-decoration-none fw-semibold ms-1">Log in</a>
            </p>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
