<!DOCTYPE html>
<html lang="en">
<head>
    <title>Log In - Crescendo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .auth-card { background-color: #181818; padding: 2.5rem; border-radius: 8px; width: 100%; max-width: 400px; }
        .form-control { background-color: #242424; border: none; color: white; margin-bottom: 1rem; padding: 0.75rem; }
        .form-control:focus { background-color: #2a2a2a; color: white; box-shadow: none; border: 1px solid #535353; }
        label { margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; color: #b3b3b3; }
    </style>
</head>
<body>
    <div class="auth-card shadow-lg">
        <h2 class="text-center fw-bold mb-4 text-white">Log in to Crescendo</h2>
        
        {% if form.errors %}
            <div class="alert alert-danger py-2 small text-center" style="background-color: #e91429; border: none; color: white;">
                Your username and password didn't match. Please try again.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <!-- Django built-in fields loop with bootstrap formatting -->
            {% for field in form %}
                <div class="mb-2">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold mt-4 py-2" style="background-color: #1db954; border: none;">Log In</button>
        </form>
        
        <div class="text-center mt-4 small text-muted">
            Don't have an account? <a href="{% url 'music:register' %}" class="text-white fw-bold text-decoration-none">Sign Up</a>
        </div>
    </div>

    <!-- Quick script to dynamically make Django widgets look like nice Bootstrap inputs -->
    <script>
        document.querySelectorAll('input').forEach(el => el.classList.add('form-control'));
    </script>
</body>
</html>
